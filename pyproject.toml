[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-api-tester"
version = "0.1.0"
description = "A small CLI for testing OpenAI model access and responses."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=2.34.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.scripts]
openai-api-tester = "openai_api_tester:main"

[tool.setuptools]
py-modules = ["openai_api_tester"]
